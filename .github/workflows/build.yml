name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SFML
        run: |
          curl -L -o sfml.zip https://www.sfml-dev.org/files/SFML-3.0.0-windows-vc17-64-bit.zip
          7z x sfml.zip -osfml_extract
          move sfml_extract\SFML-3.0.0 SFML

      - name: Configure CMake
        run: cmake -B build -DSFML_DIR=SFML/lib/cmake/SFML

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir package
          copy build\bin\Release\evosim.exe package\
          copy SFML\bin\*.dll package\
          xcopy build\bin\assets package\assets\ /E /I

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evosim-windows
          path: package/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SFML
        run: brew install sfml

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p package
          cp build/bin/evosim package/
          cp -r build/bin/assets package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evosim-macos
          path: package/

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          cd artifacts
          zip -r ../evosim-windows.zip evosim-windows
          tar -czvf ../evosim-macos.tar.gz evosim-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            evosim-windows.zip
            evosim-macos.tar.gz
          generate_release_notes: true
